notes:
- 'Range stream: full-rate backup logs (~12.5 Hz); MQTT DBs hold a subsampled duplicate.'
- All timestamps unified onto the Vicon (tracking PC) clock; broker receive times
  are contaminated by logger queueing and only used for min-envelope offset estimation.
- Distance matrices are directed (row = measuring node); symmetrize in the loader.
- 'Vicon -> local ENU registration: wand tie from the surveyed control points WAND-0-0
  (Vicon origin, incl. height) and WAND-001 (Vicon +y axis), yaw about the vertical,
  scale 1, one transform for s01 and s02. Independent of the UWB ranges; Code/methods/estimate_vicon_transform.py
  fits a UWB-based transform as a cross-check.'
